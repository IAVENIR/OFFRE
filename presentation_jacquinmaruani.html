<!DOCTYPE html>
<html lang="fr"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IAvenir - Transformation IA</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    html{scroll-behavior:smooth}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    .animate-bounce{animation:bounce 2s infinite}
    @keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .fade-in{animation:fadeIn .4s ease both}
    #partenaires-iavenir{padding:1.75rem 0 2.5rem;background:linear-gradient(180deg,#fff,#f3f0ff);overflow:hidden}
    #partenaires-iavenir .pi-wrap{max-width:1200px;margin:0 auto;padding:0 1.5rem;text-align:center}
    #partenaires-iavenir .pi-kicker{font:600 .8rem/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.16em;color:#7B61FF;text-transform:uppercase;margin:0 0 1.25rem}
    #partenaires-iavenir .pi-marquee{position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
    #partenaires-iavenir .pi-track{display:flex;width:max-content;animation:pi-scroll 45s linear infinite}
    #partenaires-iavenir .pi-marquee:hover .pi-track{animation-play-state:paused}
    #partenaires-iavenir .pi-card{flex:0 0 auto;width:170px;height:84px;margin-right:2.25rem;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:14px;box-shadow:0 5px 20px rgba(80,60,160,.09);padding:1rem 1.25rem;box-sizing:border-box;font-weight:700;color:#374151}
    #partenaires-iavenir .pi-card img{max-width:100%;max-height:50px;width:auto;height:auto;object-fit:contain}
    @keyframes pi-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
    @media(max-width:640px){#partenaires-iavenir .pi-card{width:140px;height:72px;margin-right:1.5rem}}
    .cas-track{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;padding:8px 44px 16px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
    .cas-track::-webkit-scrollbar{display:none}
    .cas-card{flex:0 0 240px;min-height:190px}
    .cas-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:40px;height:40px;border-radius:9999px;background:#fff;box-shadow:0 4px 14px rgba(80,60,160,.18);color:#6d28d9;font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center}
    @media (prefers-reduced-motion:reduce){#partenaires-iavenir .pi-track{animation:none}}
    .rdv-only{display:none!important}
    body.rdv .rdv-only{display:inline-flex!important}
  </style>
  <script>
    tailwind.config={theme:{extend:{colors:{iavenir:{50:'#f5f3ff',100:'#ede9fe',200:'#ddd6fe',300:'#c4b5fd',400:'#a78bfa',500:'#8B5CF6',600:'#7c3aed',700:'#6d28d9',800:'#5b21b6',900:'#4c1d95'}}}}}
  </script>
</head>

      <div class="flex items-center gap-4">${state.includeDiag?`<span class="font-bold text-iavenir-600 text-lg">${fmt(audit.total)}</span>`:''}<button onclick="toggleDiag()" class="w-12 h-6 rounded-full transition-colors ${state.includeDiag?'bg-iavenir-500':'bg-gray-300'}"><div class="w-5 h-5 bg-white rounded-full shadow transform transition-transform ${state.includeDiag?'translate-x-6':'translate-x-0.5'} mt-0.5 ml-0.5"></div></button></div>

  </div>
  <div class="bg-white rounded-2xl border-2 ${state.includeFormation?'border-iavenir-300':'border-gray-200'} p-6 shadow-sm">
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-3"><div class="w-10 h-10 bg-iavenir-100 rounded-xl flex items-center justify-center text-iavenir-600">${ic.grad}</div><div><div class="font-bold text-gray-900">Formation</div><div class="text-sm text-gray-400">Cas d'usage maîtrisables par vos équipes</div></div></div>
      <div class="flex items-center gap-4">${state.includeFormation?`<span class="font-bold text-iavenir-600 text-lg">${fmt(formation.final)}</span>`:''}<button onclick="toggleFormation()" class="w-12 h-6 rounded-full transition-colors ${state.includeFormation?'bg-iavenir-500':'bg-gray-300'}"><div class="w-5 h-5 bg-white rounded-full shadow transform transition-transform ${state.includeFormation?'translate-x-6':'translate-x-0.5'} mt-0.5 ml-0.5"></div></button></div>
    </div>
    ${state.includeFormation?`<div class="grid md:grid-cols-3 gap-4 pt-3 border-t border-gray-100"><div><label class="text-xs text-gray-500 block mb-2 font-medium">Durée / session</label><div class="flex gap-1">${[[0.5,'0.5j'],[1,'1j'],[2,'2j']].map(([v,l])=>`<button onclick="setDuration(${v})" class="flex-1 py-2 rounded-lg text-xs font-bold transition ${state.formationConfig.duration===v?'bg-iavenir-500 text-white':'bg-gray-100 text-gray-600 hover:bg-gray-200'}">${l}</button>`).join('')}</div></div><div><label class="text-xs text-gray-500 block mb-2 font-medium">Sessions</label><input type="number" id="formSessions" value="${state.formationConfig.sessions}" min="1" max="50" class="w-full p-2 rounded-xl border-2 border-gray-200 text-center font-bold focus:border-iavenir-500 focus:outline-none text-sm"></div><div><label class="text-xs text-gray-500 block mb-2 font-medium">Participants</label><input type="number" id="formParticipants" value="${state.formationConfig.participants}" min="1" max="500" class="w-full p-2 rounded-xl border-2 border-gray-200 text-center font-bold focus:border-iavenir-500 focus:outline-none text-sm"></div></div>${formation.disc>0?`<div class="mt-2 text-xs text-emerald-600 font-medium">✓ Remise volume -${Math.round(formation.disc*100)}% appliquée</div>`:''}`:''}
  </div>
  <div class="bg-white rounded-2xl border-2 ${state.includeDeploiement?'border-purple-300':'border-gray-200'} p-6 shadow-sm">
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-3"><div class="w-10 h-10 bg-purple-100 rounded-xl flex items-center justify-center text-purple-600">${ic.rocket}</div><div><div class="font-bold text-gray-900">Déploiement IA</div><div class="text-sm text-gray-400">Cas d'usage complexes — consultant spécialisé</div></div></div>
      <div class="flex items-center gap-4">${state.includeDeploiement?`<span class="font-bold text-purple-600 text-lg">${fmt(deploy.total)}</span>`:''}<button onclick="toggleDeploy()" class="w-12 h-6 rounded-full transition-colors ${state.includeDeploiement?'bg-purple-500':'bg-gray-300'}"><div class="w-5 h-5 bg-white rounded-full shadow transform transition-transform ${state.includeDeploiement?'translate-x-6':'translate-x-0.5'} mt-0.5 ml-0.5"></div></button></div>
    </div>
    ${state.includeDeploiement?`<div class="flex items-center gap-4 pt-3 border-t border-gray-100"><label class="text-sm text-gray-600">Jours consultant</label><input type="number" id="deployJours" value="${state.deploiementConfig.jours}" min="1" class="w-24 p-2 rounded-xl border-2 border-gray-200 text-center font-bold focus:border-purple-500 focus:outline-none"><span class="text-sm text-gray-500">× 780 € / jour</span></div>`:''}
  </div>
  ${(state.includeDiag||state.includeFormation||state.includeDeploiement)?`<div class="bg-iavenir-600 rounded-2xl p-6 text-white text-center"><div class="text-iavenir-200 mb-1">Investissement total estimé</div><div class="text-4xl font-bold">${fmt(total)}</div><div class="text-iavenir-300 text-sm mt-1">HT — Hors frais de déplacement</div></div>`:''}
</div>`}

function cfgFormation(f){return`<div class="max-w-2xl mx-auto bg-white rounded-2xl border-2 border-iavenir-300 shadow-lg p-8">
  <div class="grid md:grid-cols-2 gap-6 mb-6">
    <div><label class="text-sm font-medium text-gray-700 block mb-2">Format</label><div class="grid grid-cols-2 gap-2">${[['presentiel',ic.build,'Présentiel'],['distanciel',ic.monitor,'Distanciel']].map(([v,icon,lbl])=>`<button onclick="setFormat('${v}')" class="p-3 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition ${state.formationConfig.format===v?'bg-iavenir-500 text-white':'bg-gray-100 text-gray-600 hover:bg-gray-200'}">${icon}${lbl}</button>`).join('')}</div></div>
    <div><label class="text-sm font-medium text-gray-700 block mb-2">Durée / session</label><div class="grid grid-cols-3 gap-2">${[[0.5,'0.5j','1 400 €'],[1,'1j','2 400 €'],[2,'2j','4 300 €']].map(([v,l,p])=>`<button onclick="setDuration(${v})" class="p-3 rounded-xl text-center transition ${state.formationConfig.duration===v?'bg-iavenir-500 text-white':'bg-gray-100 text-gray-600 hover:bg-gray-200'}"><div class="font-bold text-sm">${l}</div><div class="text-xs opacity-75">${p}</div></button>`).join('')}</div></div>
  </div>
  <div class="grid grid-cols-2 gap-4 mb-6">

    <div><label class="text-sm font-medium text-gray-700 block mb-2">Participants</label><input type="number" id="formParticipants" value="${state.formationConfig.participants}" min="1" max="500" class="w-full p-3 rounded-xl border-2 border-gray-200 text-center text-xl font-bold focus:border-iavenir-500 focus:outline-none"></div>
  </div>
  <div class="bg-iavenir-50 border border-iavenir-200 rounded-xl p-4">${f.disc>0?`<div class="flex justify-between text-sm text-emerald-700 mb-2"><span>Remise volume -${Math.round(f.disc*100)}%</span><span>-${fmt(f.discAmt)}</span></div>`:''}<div class="flex justify-between items-center"><span class="font-bold text-gray-900">Total Formation</span><span class="text-3xl font-bold text-iavenir-600">${fmt(f.final)}</span></div><div class="text-xs text-gray-400 text-right mt-1">HT</div></div>
</div>`}

function roiBlock(roi){return`<div class="mt-10 bg-white rounded-2xl border-2 border-iavenir-200 p-8 shadow-sm">
  <div class="text-center mb-6"><h3 class="text-xl font-bold text-gray-900">ROI Estimé</h3><p class="text-gray-500 text-sm">${state.formationConfig.participants} collaborateur(s) formé(s)</p></div>
  <div class="grid md:grid-cols-3 gap-4 mb-6">${[[roi.saved+'h','Temps gagné / pers. / sem.','questionnaires de satisfaction'],[ fmt(roi.monthly),'Gains nets / mois','après coût licences'],[roi.payback>0?Math.floor(roi.payback)+' mois':'—','Retour sur investissement','']].map(([v,l,s])=>`<div class="bg-iavenir-50 rounded-xl p-5 text-center border border-iavenir-100"><div class="text-2xl font-bold text-iavenir-700 mb-1">${v}</div><div class="text-sm text-gray-700 font-medium">${l}</div>${s?`<div class="text-xs text-gray-400">${s}</div>`:''}</div>`).join('')}</div>
  <div class="bg-gray-50 rounded-xl p-4 text-xs text-gray-500 grid md:grid-cols-3 gap-2"><div>• Salaire moyen chargé : 3 500 €/mois</div><div>• Temps gagné : 2 h / pers. / sem. (questionnaires de satisfaction IAvenir)</div><div>• Coût licences IA : 25 €/utilisateur/mois</div></div>
</div>`}

function caseCard(c,i){return `<button onclick="openCase(${i})" class="cas-card text-left bg-white rounded-2xl border-2 border-gray-200 shadow-lg p-5 hover:border-iavenir-300 transition-colors flex flex-col gap-3"><div class="h-12 flex items-center">${caseLogo(c)}</div><div class="font-bold text-gray-900">${c.tags.join(' · ')}</div><div class="text-sm text-gray-500">${c.name}</div><div class="mt-auto text-sm font-semibold text-iavenir-600">Voir le cas →</div></button>`}
function casList(){const q=casState.q.trim().toLowerCase();return CASES.map((c,i)=>[c,i]).filter(([c])=>(casState.filter==='Tous'||c.tags.includes(casState.filter))&&(!q||c.name.toLowerCase().includes(q)))}
function renderCases(){const t=document.getElementById('casTrack');if(!t)return;const l=casList();const loop=!casState.q&&l.length>4;t.dataset.loop=loop?'1':'';t.innerHTML=l.length?(loop?l.concat(l):l).map(([c,i])=>caseCard(c,i)).join(''):'<div class="text-gray-400 py-10 px-4">Aucune entreprise ne correspond.</div>';t.scrollLeft=0;document.querySelectorAll('.cas-chip').forEach(b=>{const on=b.dataset.f===casState.filter;b.className='cas-chip px-4 py-2 rounded-full text-sm font-semibold transition '+(on?'bg-iavenir-500 text-white shadow':'bg-gray-100 text-gray-600 hover:bg-gray-200')});const s=document.getElementById('casSearch');if(s&&s.value!==casState.q)s.value=casState.q;}
function setCasFilter(f){casState.filter=f;renderCases()}
function setCasSearch(v){casState.q=v;renderCases();const s=document.getElementById('casSearch');if(s){s.focus();s.setSelectionRange(v.length,v.length)}}
function casNav(d){const t=document.getElementById('casTrack');if(!t)return;casState.hold=Date.now()+5000;t.scrollBy({left:d*560,behavior:'smooth'})}
(function tick(){const t=document.getElementById('casTrack');const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;if(t&&!reduce&&!casState.paused&&Date.now()>casState.hold&&!(document.getElementById('caseModal')||{}).classList?.contains('flex')){t.scrollLeft+=0.6;if(t.dataset.loop&&t.scrollLeft>=t.scrollWidth/2)t.scrollLeft-=t.scrollWidth/2;}requestAnimationFrame(tick)})();
function openCase(i){
  const c=CASES[i];
  document.getElementById('caseBody').innerHTML=`
    <div class="bg-gradient-to-r from-iavenir-500 to-iavenir-700 p-6 text-white flex items-start justify-between gap-4">
      <div class="flex items-center gap-4">${c.logo?`<div class="bg-white rounded-xl p-2 h-14 flex items-center"><img src="${c.logo}" alt="${c.name}" class="max-h-10 w-auto object-contain"></div>`:''}<div><div class="text-iavenir-100 text-xs font-bold uppercase tracking-wider mb-1">${c.tags.join(' · ')}</div><h3 class="text-2xl font-bold">${c.name}</h3></div></div>
      <button onclick="closeCase()" class="w-9 h-9 bg-white/20 rounded-full flex items-center justify-center text-white text-xl flex-shrink-0" aria-label="Fermer">×</button>
    </div>
    <div class="p-6 space-y-5 max-h-[60vh] overflow-y-auto">
      ${c.tags.map(t=>`<div><div class="flex items-center gap-2 mb-2"><span class="w-8 h-8 bg-iavenir-100 rounded-lg flex items-center justify-center text-iavenir-600">${t==='Cartographie'?ic.search:t==='Formation'?ic.grad:ic.rocket}</span><span class="font-bold text-gray-900">${t}</span></div><div class="space-y-2 pl-10">${c.parts[t].map(x=>`<div class="flex items-start gap-2"><span class="text-iavenir-500 flex-shrink-0 mt-0.5">${ic.check}</span><span class="text-gray-700 text-sm">${x}</span></div>`).join('')}</div></div>`).join('')}
      ${c.drive?`<a href="${c.drive}" target="_blank" rel="noopener" class="rdv-only items-center gap-2 bg-gray-900 text-white px-5 py-2.5 rounded-full text-sm font-semibold hover:bg-gray-800 transition">${ic.folder} Ouvrir le dossier Drive</a>`:''}
    </div>`;
  const m=document.getElementById('caseModal');m.classList.remove('hidden');m.classList.add('flex');
}
function closeCase(){const m=document.getElementById('caseModal');m.classList.add('hidden');m.classList.remove('flex');}

function setParcours(p){state.parcours=p;if(p==='complet'){state.includeDiag=true;state.includeFormation=true;}else if(p==='formation'){state.includeDiag=false;state.includeFormation=true;state.includeDeploiement=false;}render();document.getElementById('offre')?.scrollIntoView({behavior:'smooth'});}
function toggleDiag(){state.includeDiag=!state.includeDiag;render()}
function toggleFormation(){state.includeFormation=!state.includeFormation;render()}
function toggleDeploy(){state.includeDeploiement=!state.includeDeploiement;render()}
function setDuration(d){state.formationConfig.duration=d;render()}
function setFormat(f){state.formationConfig.format=f;render()}

window.setParcours=setParcours;window.toggleDiag=toggleDiag;window.toggleFormation=toggleFormation;window.toggleDeploy=toggleDeploy;window.setDuration=setDuration;window.setFormat=setFormat;window.openCase=openCase;window.closeCase=closeCase;window.logoFail=logoFail;

/* Mode RDV : touche R, ou ?rdv / #rdv dans l'adresse */
if(/(^|[?&])rdv/.test(location.search)||location.hash==='#rdv')document.body.classList.add('rdv');
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;if(e.key==='r'||e.key==='R')document.body.classList.toggle('rdv');if(e.key==='Escape')closeCase();});

render();
</script>
